[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masa-google-takeout-compressor"
version = "0.2.0"
description = "Media Archive Structuring and Archival CLI for Google Takeout photo archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "piexif>=1.1.3",
  "pillow-avif-plugin>=1.4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
masa = "masa_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-dir]
"" = "src/python"
