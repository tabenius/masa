[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masa-google-takeout-compressor"
version = "0.3.0"
description = "Media Archive Structuring and Archival CLI for Google Takeout photo archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "piexif>=1.1.3",
  "pillow-avif-plugin>=1.4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
  "setuptools>=68",
  "wheel>=0.45",
]

[project.scripts]
masa = "masa_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-dir]
"" = "src/python"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
